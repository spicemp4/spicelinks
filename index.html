<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>kandi :33</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Cherry Bomb One', cursive;
      min-height: 100%;
      min-height: 100svh;
      color: #292929;
      background: transparent;
      isolation: isolate;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -15px;
      background: url('background.png') center center / cover no-repeat;
      filter: blur(7px) brightness(0.8);
      z-index: -1;
    }

    /* STARTUP SCREEN */

    .startup {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
      transition: opacity 1s ease, visibility 1s ease;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .startup-text {
      font-size: 1rem;
      font-weight: 900;
      color: #292929;
      animation: flash 1s infinite alternate;
      text-shadow: 0 0 8px rgba(0,0,0,0.15);
      text-align: center;
      padding: 20px;
    }

    .startup.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* MAIN CONTENT */

    .content {
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 2rem;
      opacity: 0;
      transform: translateY(15px) scale(1);
      transition: opacity 1.5s ease;
      pointer-events: none;
      will-change: transform;
    }

    .content.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .name {
      font-size: 2.5rem;
      font-weight: 900;
      color: #292929;
      animation: flash 1s infinite alternate;
      position: relative;
      text-shadow: 0 0 8px rgba(0,0,0,0.15);
    }

    .name:hover::after {
      content: "transfem!! 🏳️‍⚧️🏳️‍⚧️";
      position: absolute;
      bottom: -1.4rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #292929;
      opacity: 0.8;
      white-space: nowrap;
    }

    /* SOCIAL LINKS */

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 2rem;
    }

    .link-btn {
      width: 32px;
      height: 32px;
      background: rgba(0,0,0,0.08);
      backdrop-filter: blur(12px);
      border-radius: 25%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease, background 0.25s ease;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .link-btn:hover {
      transform: scale(1.15);
      background: rgba(0,0,0,0.2);
    }

    .link-btn img {
      width: 22px;
      height: 22px;
      filter: brightness(0);
      opacity: 0.7;
      pointer-events: none;
    }

    /* AUDIO VISUALIZER */

    .visualizer {
      display: block;
      width: min(440px, 100%);
      height: auto;
      aspect-ratio: 880 / 200;
      margin: 1rem auto 0;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .content.visible .visualizer {
      opacity: 0.75;
    }

    /* SOUNDCLOUD LINK */

    .soundcloud-link {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      right: calc(20px + env(safe-area-inset-right));
      color: #292929;
      font-size: 0.9rem;
      text-decoration: none;
      opacity: 0.65;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 5;
    }

    .soundcloud-link:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    /* GIF + VOLUME CONTROLS */

    .bottom-left-controls {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: calc(20px + env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      z-index: 5;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;

      transition: opacity 1.5s ease, visibility 1.5s ease;
    }

    .bottom-left-controls.visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    /* VOLUME BAR */

    .volume-control {
      box-sizing: border-box;
      width: 166px;
      height: 36px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 11px;

      background: rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(8px);
      border-radius: 20px;

      color: #292929;
      opacity: 0.7;
      transition: opacity 0.25s ease;

      flex: 0 0 auto;
    }

    .volume-control:hover,
    .gif-placeholder:hover {
      opacity: 1;
    }

    .volume-icon {
      width: 13px;
      flex: 0 0 13px;
      font-size: 13px;
      line-height: 1;
      user-select: none;
      text-align: center;
    }

    .volume-slider {
      width: auto;
      min-width: 0;
      flex: 1 1 auto;
      height: 6px;

      appearance: none;
      -webkit-appearance: none;

      background: rgba(41, 41, 41, 0.2);
      border-radius: 10px;
      outline: none;
      cursor: pointer;

      touch-action: pan-x;
    }

    .volume-slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #292929;
      cursor: pointer;
    }

    .volume-slider::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border: none;
      border-radius: 50%;
      background: #292929;
      cursor: pointer;
    }

    .volume-percent {
      box-sizing: border-box;
      width: 32px;
      flex: 0 0 32px;
      font-size: 0.7rem;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
      user-select: none;
    }

    /* FUTURE GIF PLACEHOLDER */

    .gif-placeholder {
      width: 166px;
      height: 166px;
      box-sizing: border-box;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1.5px dashed rgba(41, 41, 41, 0.45);
      border-radius: 12px;

      background: rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(8px);

      color: rgba(41, 41, 41, 0.65);
      font-size: 0.7rem;
      letter-spacing: 0.04em;

      user-select: none;
      opacity: 0.7;
      transition: opacity 0.25s ease;

      flex: 0 0 auto;
    }

    /* MOBILE LAYOUT */

    @media (max-width: 600px) {
      body {
        min-height: 100svh;
        align-items: center;
      }

      .content {
        width: 100%;
        padding: 1.25rem;
      }

      .name {
        font-size: clamp(1.8rem, 8vw, 2.3rem);
      }

      .links {
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .link-btn {
        width: 42px;
        height: 42px;
      }

      .link-btn img {
        width: 23px;
        height: 23px;
      }

      .visualizer {
        width: min(360px, 85vw);
        height: auto;
      }

      /* Make the controls larger and easier to touch */

      .bottom-left-controls {
        bottom: calc(14px + env(safe-area-inset-bottom));
        left: calc(14px + env(safe-area-inset-left));
        gap: 9px;
      }

      .volume-control {
        width: 220px;
        height: 48px;
        gap: 12px;
        padding: 10px 13px;
        border-radius: 24px;
      }

      .volume-icon {
        width: 18px;
        flex-basis: 18px;
        font-size: 19px;
      }

      .volume-slider {
        height: 8px;
      }

      .volume-slider::-webkit-slider-thumb {
        width: 20px;
        height: 20px;
      }

      .volume-slider::-moz-range-thumb {
        width: 20px;
        height: 20px;
      }

      .volume-percent {
        width: 38px;
        flex-basis: 38px;
        font-size: 0.85rem;
      }

      .gif-placeholder {
        width: 220px;
        height: 220px;
        border-radius: 14px;
      }

      .soundcloud-link {
        bottom: calc(16px + env(safe-area-inset-bottom));
        right: calc(14px + env(safe-area-inset-right));
        font-size: 0.8rem;
      }
    }

    /* SMALL PHONES */

    @media (max-width: 380px) {
      .bottom-left-controls {
        left: 10px;
        bottom: calc(10px + env(safe-area-inset-bottom));
      }

      .volume-control {
        width: 190px;
      }

      .gif-placeholder {
        width: 190px;
        height: 190px;
      }

      .soundcloud-link {
        right: 10px;
        font-size: 0.7rem;
      }

      .content {
        padding: 1rem;
      }

      .links {
        gap: 0.8rem;
      }
    }

    @keyframes flash {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0.6;
      }
    }

    /* REDUCE ANIMATIONS IF THE DEVICE REQUESTS IT */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <div class="startup" id="startup">
    <div class="startup-text" id="startupText">
      PRESS ANY KEY TO START
    </div>
  </div>

  <div class="content" id="content">
    <div class="name">kandi :33</div>

    <div class="links">

      <div class="link-btn" onclick="window.open('https://x.com/freakycodone', '_blank')">
        <img src="twitter.png" alt="Twitter" />
      </div>

      <div class="link-btn" onclick="window.open('https://www.roblox.com/users/4405495358/profile', '_blank')">
        <img src="roblox.png" alt="Roblox" />
      </div>

      <div class="link-btn" onclick="window.open('https://www.tiktok.com/@spicesune', '_blank')">
        <img src="tiktok.png" alt="TikTok" />
      </div>

      <div class="link-btn" onclick="window.open('https://www.youtube.com/@umbreonlasagna', '_blank')">
        <img src="youtube.png" alt="YouTube" />
      </div>

      <div class="link-btn" onclick="window.open('https://soundcloud.com/spicemp4', '_blank')">
        <img src="soundcloud.png" alt="SoundCloud" />
      </div>

    </div>

    <canvas class="visualizer" id="visualizer" width="880" height="200"></canvas>
  </div>

  <div class="bottom-left-controls">

    <div class="gif-placeholder" aria-label="GIF placeholder">
      GIF
    </div>

    <div class="volume-control">
      <span class="volume-icon">♫</span>

      <input
        type="range"
        class="volume-slider"
        id="volumeSlider"
        min="0"
        max="100"
        value="100"
        aria-label="Volume"
      />

      <span class="volume-percent" id="volumePercent">100%</span>
    </div>

  </div>

  <a class="soundcloud-link"
     href="https://soundcloud.com/100gecs/hollywood-baby"
     target="_blank"
     rel="noopener noreferrer">
    soundcloud ♫
  </a>

  <audio id="audio" loop preload="auto">
    <source src="Hollywood_Baby_100_gecs.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const audio = document.getElementById('audio');
    const startup = document.getElementById('startup');
    const startupText = document.getElementById('startupText');
    const content = document.getElementById('content');
    const bottomLeftControls = document.querySelector('.bottom-left-controls');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d', { alpha: true });
    const volumeSlider = document.getElementById('volumeSlider');
    const volumePercent = document.getElementById('volumePercent');

    const targetVolume = 0.175;
    const fadeDuration = 1800;
    const frameInterval = 1000 / 60;

    // Detect touch-based/mobile devices.
    const isMobile =
      window.matchMedia('(pointer: coarse)').matches ||
      navigator.maxTouchPoints > 0;

    // Change the startup instructions depending on the device.
    if (isMobile) {
      startupText.textContent = 'TAP ANYWHERE TO START';
    } else {
      startupText.textContent = 'PRESS ANY KEY TO START';
    }

    let fadeInterval = null;
    let fadeToken = 0;
    let hasStarted = false;
    let audioContext = null;
    let analyser = null;
    let frequencyData = null;
    let animationFrame = null;
    let lastFrame = 0;
    let currentZoom = 1;
    let isActive = true;
    let volumeLevel = 1;

    audio.volume = 0;

    // VOLUME SLIDER

    volumeSlider.addEventListener('input', () => {
      volumeLevel = Number(volumeSlider.value) / 100;
      volumePercent.textContent = `${volumeSlider.value}%`;

      // Cancel an ongoing fade so the slider responds immediately.
      clearInterval(fadeInterval);
      fadeInterval = null;
      fadeToken++;

      if (!hasStarted) return;

      if (volumeLevel === 0) {
        audio.volume = 0;
        audio.pause();
      } else if (isActive) {
        audio.volume = targetVolume * volumeLevel;

        if (audio.paused) {
          audioContext.resume();
          audio.play().catch(() => {});
        }
      }
    });

    // AUDIO FADING

    function fadeAudio(target) {
      clearInterval(fadeInterval);

      const token = ++fadeToken;
      const steps = 40;
      const intervalTime = fadeDuration / steps;

      const startVolume = audio.volume;
      const difference = target - startVolume;
      let step = 0;

      fadeInterval = setInterval(() => {
        if (token !== fadeToken) return;

        step++;

        audio.volume = Math.max(
          0,
          Math.min(1, startVolume + difference * (step / steps))
        );

        if (step >= steps) {
          clearInterval(fadeInterval);
          fadeInterval = null;
          audio.volume = target;

          if (target === 0) {
            audio.pause();
          }
        }
      }, intervalTime);
    }

    // VISUALIZER SETUP

    function setupVisualizer() {
      if (audioContext) return;

      audioContext = new AudioContext();
      analyser = audioContext.createAnalyser();

      analyser.fftSize = 64;
      analyser.smoothingTimeConstant = 0.45;

      const source = audioContext.createMediaElementSource(audio);

      source.connect(analyser);
      analyser.connect(audioContext.destination);

      frequencyData = new Uint8Array(analyser.frequencyBinCount);
    }

    // DRAW VISUALIZER

    function drawVisualizer(timestamp) {
      animationFrame = requestAnimationFrame(drawVisualizer);

      if (!isActive || !analyser) return;

      if (timestamp - lastFrame < frameInterval) return;
      lastFrame = timestamp;

      analyser.getByteFrequencyData(frequencyData);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // VISUALIZER BARS

      const barCount = 16;
      const gap = 8;
      const barWidth = 25;

      const totalWidth = barCount * barWidth + (barCount - 1) * gap;
      const startX = (canvas.width - totalWidth) / 2;

      for (let i = 0; i < barCount; i++) {
        const dataIndex = Math.floor(
          Math.pow(i / (barCount - 1), 1.6) * (frequencyData.length - 1)
        );

        const value = frequencyData[dataIndex] / 255;
        const amplifiedValue = Math.pow(value, 1.8);
        const barHeight = Math.max(4, amplifiedValue * 190);

        const x = startX + i * (barWidth + gap);
        const y = (canvas.height - barHeight) / 2;

        ctx.fillStyle = '#292929';
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, barHeight, 5);
        ctx.fill();
      }

      // MUSIC-REACTIVE UI ZOOM

      const bassLevel = (
        frequencyData[0] +
        frequencyData[1] +
        frequencyData[2]
      ) / 3;

      const bassAmount = Math.min(1, bassLevel / 255);
      const targetZoom = 1 + Math.pow(bassAmount, 0.65) * 0.12;

      const speed = targetZoom > currentZoom ? 0.45 : 0.30;
      currentZoom += (targetZoom - currentZoom) * speed;

      if (hasStarted) {
        content.style.transform = `translateY(0) scale(${currentZoom})`;
      }
    }

    // START WEBSITE

    async function startWebsite() {
      if (hasStarted) return;

      hasStarted = true;

      startup.classList.add('hidden');
      content.classList.add('visible');
      bottomLeftControls.classList.add('visible');

      setupVisualizer();

      try {
        await audioContext.resume();

        if (volumeLevel > 0) {
          await audio.play();
          fadeAudio(targetVolume * volumeLevel);
        }
      } catch (error) {
        console.log("Audio playback failed:", error);
      }

      if (isActive) {
        animationFrame = requestAnimationFrame(drawVisualizer);
      }

      document.removeEventListener('keydown', handleKeyStart);
    }

    // DESKTOP: PRESS ANY KEY
    function handleKeyStart(event) {
      // Don't start the website when someone is using the volume slider.
      if (event.target === volumeSlider) return;

      startWebsite();
    }

    document.addEventListener('keydown', handleKeyStart);

    // MOBILE + DESKTOP: TAP OR CLICK STARTUP SCREEN
    startup.addEventListener('click', startWebsite);

    // PAUSE WHEN THE USER LEAVES THE TAB

    function checkFocus() {
      if (!hasStarted) return;

      isActive = !document.hidden && document.hasFocus();

      if (isActive) {
        audioContext.resume();

        if (volumeLevel > 0) {
          audio.play().then(() => {
            fadeAudio(targetVolume * volumeLevel);
          }).catch(() => {});
        }

        if (!animationFrame) {
          lastFrame = 0;
          animationFrame = requestAnimationFrame(drawVisualizer);
        }
      } else {
        fadeAudio(0);

        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
      }
    }

    document.addEventListener('visibilitychange', checkFocus);
    window.addEventListener('focus', checkFocus);
    window.addEventListener('blur', checkFocus);
  </script>

</body>
</html>
