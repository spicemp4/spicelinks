<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kandi :33</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Cherry Bomb One', cursive;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #292929;
      background: transparent;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -15px;
      background: url('background.png') center center / cover no-repeat;
      filter: blur(7px) brightness(0.8);
      z-index: -1;
    }

    .startup {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      cursor: pointer;
      transition: opacity 1s ease, visibility 1s ease;
    }

    .startup-text {
      font-size: 1rem;
      font-weight: 900;
      color: #292929;
      animation: flash 1s infinite alternate;
      text-shadow: 0 0 8px rgba(0,0,0,0.15);
    }

    .startup.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .content {
      text-align: center;
      padding: 2rem;
      opacity: 0;
      transform: translateY(15px) scale(1);
      transition: opacity 1.5s ease;
      pointer-events: none;
      will-change: transform;
    }

    .content.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .name {
      font-size: 2.5rem;
      font-weight: 900;
      color: #292929;
      animation: flash 1s infinite alternate;
      position: relative;
      text-shadow: 0 0 8px rgba(0,0,0,0.15);
    }

    .name:hover::after {
      content: "transfem!! 🏳️‍⚧️🏳️‍⚧️";
      position: absolute;
      bottom: -1.4rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #292929;
      opacity: 0.8;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 2rem;
    }

    .link-btn {
      width: 32px;
      height: 32px;
      background: rgba(0,0,0,0.08);
      backdrop-filter: blur(12px);
      border-radius: 25%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease, background 0.25s ease;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .link-btn:hover {
      transform: scale(1.15);
      background: rgba(0,0,0,0.2);
    }

    .link-btn img {
      width: 22px;
      height: 22px;
      filter: brightness(0);
      opacity: 0.7;
    }

    .visualizer {
      display: block;
      width: 440px;
      height: 100px;
      margin: 2rem auto 0;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .content.visible .visualizer {
      opacity: 0.75;
    }

    .soundcloud-link {
      position: fixed;
      bottom: 20px;
      right: 20px;
      color: #292929;
      font-size: 0.9rem;
      text-decoration: none;
      opacity: 0.65;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 5;
    }

    .soundcloud-link:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    @keyframes flash {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0.6;
      }
    }

    @media (max-width: 600px) {
      .name {
        font-size: 2rem;
      }

      .link-btn {
        width: 40px;
        height: 40px;
      }

      .link-btn img {
        width: 18px;
        height: 18px;
      }

      .visualizer {
        width: 300px;
        height: 70px;
      }
    }
  </style>
</head>

<body>

  <div class="startup" id="startup">
    <div class="startup-text">PRESS ANY KEY TO START</div>
  </div>

  <div class="content" id="content">
    <div class="name">kandi :33</div>

    <div class="links">

      <div class="link-btn" onclick="window.open('https://x.com/freakycodone', '_blank')">
        <img src="twitter.png" alt="Twitter" />
      </div>

      <div class="link-btn" onclick="window.open('https://www.roblox.com/users/167229506/profile', '_blank')">
        <img src="roblox.png" alt="Roblox" />
      </div>

      <div class="link-btn" onclick="window.open('https://www.tiktok.com/@freakazoid02', '_blank')">
        <img src="tiktok.png" alt="TikTok" />
      </div>

      <div class="link-btn" onclick="window.open('https://www.youtube.com/@spicebush.mp4', '_blank')">
        <img src="youtube.png" alt="YouTube" />
      </div>

      <div class="link-btn" onclick="window.open('https://discord.com/users/spicebush07', '_blank')">
        <img src="discord.png" alt="Discord" />
      </div>

    </div>

    <canvas class="visualizer" id="visualizer" width="880" height="200"></canvas>
  </div>

  <a class="soundcloud-link"
     href="https://soundcloud.com/100gecs/hollywood-baby"
     target="_blank"
     rel="noopener noreferrer">
    soundcloud ♫
  </a>

  <audio id="audio" loop preload="auto">
    <source src="Hollywood_Baby_100_gecs.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const audio = document.getElementById('audio');
    const startup = document.getElementById('startup');
    const content = document.getElementById('content');
    const canvas = document.getElementById('visualizer');
    const ctx = canvas.getContext('2d', { alpha: true });

    const targetVolume = 0.175;
    const fadeDuration = 1800;
    const frameInterval = 1000 / 60;

    let fadeInterval = null;
    let fadeToken = 0;
    let hasStarted = false;
    let audioContext = null;
    let analyser = null;
    let frequencyData = null;
    let animationFrame = null;
    let lastFrame = 0;
    let currentZoom = 1;
    let isActive = true;

    audio.volume = 0;

    function fadeAudio(target) {
      clearInterval(fadeInterval);

      const token = ++fadeToken;
      const steps = 40;
      const intervalTime = fadeDuration / steps;

      const startVolume = audio.volume;
      const difference = target - startVolume;
      let step = 0;

      fadeInterval = setInterval(() => {
        if (token !== fadeToken) return;

        step++;

        audio.volume = Math.max(
          0,
          Math.min(1, startVolume + difference * (step / steps))
        );

        if (step >= steps) {
          clearInterval(fadeInterval);
          fadeInterval = null;
          audio.volume = target;

          if (target === 0) {
            audio.pause();
          }
        }
      }, intervalTime);
    }

    function setupVisualizer() {
      if (audioContext) return;

      audioContext = new AudioContext();
      analyser = audioContext.createAnalyser();

      analyser.fftSize = 64;
      analyser.smoothingTimeConstant = 0.45;

      const source = audioContext.createMediaElementSource(audio);

      source.connect(analyser);
      analyser.connect(audioContext.destination);

      frequencyData = new Uint8Array(analyser.frequencyBinCount);
    }

    function drawVisualizer(timestamp) {
      animationFrame = requestAnimationFrame(drawVisualizer);

      if (!isActive || !analyser) return;

      if (timestamp - lastFrame < frameInterval) return;
      lastFrame = timestamp;

      analyser.getByteFrequencyData(frequencyData);

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // VISUALIZER BARS
      const barCount = 16;
      const gap = 8;
      const barWidth = (canvas.width - gap * (barCount - 1)) / barCount;

      for (let i = 0; i < barCount; i++) {
        const dataIndex = Math.floor(
          Math.pow(i / (barCount - 1), 1.6) * (frequencyData.length - 1)
        );

        const value = frequencyData[dataIndex] / 255;

        // Increase contrast between quiet and loud frequencies
        const amplifiedValue = Math.pow(value, 1.8);

        const barHeight = Math.max(4, amplifiedValue * 190);

        const x = i * (barWidth + gap);
        const y = (canvas.height - barHeight) / 2;

        ctx.fillStyle = '#292929';
        ctx.beginPath();
        ctx.roundRect(x, y, barWidth, barHeight, 5);
        ctx.fill();
      }

      // MUSIC-REACTIVE UI ZOOM
      const bassLevel = (
        frequencyData[0] +
        frequencyData[1] +
        frequencyData[2]
      ) / 3;

      const bassAmount = Math.min(1, bassLevel / 255);
      const targetZoom = 1 + Math.pow(bassAmount, 0.65) * 0.12;

      const speed = targetZoom > currentZoom ? 0.45 : 0.30;
      currentZoom += (targetZoom - currentZoom) * speed;

      if (hasStarted) {
        content.style.transform = `translateY(0) scale(${currentZoom})`;
      }
    }

    async function startWebsite() {
      if (hasStarted) return;

      hasStarted = true;

      startup.classList.add('hidden');
      content.classList.add('visible');

      setupVisualizer();

      try {
        await audioContext.resume();
        await audio.play();
        fadeAudio(targetVolume);
      } catch (error) {
        console.log("Audio playback failed:", error);
      }

      if (isActive) {
        animationFrame = requestAnimationFrame(drawVisualizer);
      }

      document.removeEventListener('keydown', startWebsite);
    }

    document.addEventListener('keydown', startWebsite);

    function checkFocus() {
      if (!hasStarted) return;

      isActive = !document.hidden && document.hasFocus();

      if (isActive) {
        audioContext.resume();

        audio.play().then(() => {
          fadeAudio(targetVolume);
        }).catch(() => {});

        if (!animationFrame) {
          lastFrame = 0;
          animationFrame = requestAnimationFrame(drawVisualizer);
        }
      } else {
        fadeAudio(0);

        if (animationFrame) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }
      }
    }

    document.addEventListener('visibilitychange', checkFocus);
    window.addEventListener('focus', checkFocus);
    window.addEventListener('blur', checkFocus);
  </script>

</body>
</html>
