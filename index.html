<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kandi :33</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Doto', sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #292929;
      background: transparent;
      isolation: isolate;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -15px;
      background: url('background.png') center center / cover no-repeat;
      filter: blur(7px) brightness(0.8);
      z-index: -1;
    }

    .content {
      text-align: center;
      animation: fadeIn 1.4s ease;
      z-index: 1;
      padding: 2rem;
    }

    .name {
      font-size: 2.5rem;
      font-weight: 900;
      color: #292929;
      animation: flash 1s infinite alternate;
      position: relative;
      text-shadow: 0 0 8px rgba(0,0,0,0.15);
    }

    .name:hover::after {
      content: "transfem!! 🏳️‍⚧️🏳️‍⚧️🏳️‍⚧️";
      position: absolute;
      bottom: -1.4rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #292929;
      opacity: 0.8;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 2rem;
    }

    .link-btn {
      width: 32px;
      height: 32px;
      background: rgba(0,0,0,0.08);
      backdrop-filter: blur(12px);
      border-radius: 25%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease, background 0.25s ease;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
      cursor: pointer;
    }

    .link-btn:hover {
      transform: scale(1.15);
      background: rgba(0,0,0,0.2);
    }

    .link-btn img {
      width: 22px;
      height: 22px;
      filter: brightness(0);
      opacity: 0.7;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes flash {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0.6;
      }
    }

    @media (max-width: 600px) {
      .name {
        font-size: 2rem;
      }

      .link-btn {
        width: 40px;
        height: 40px;
      }

      .link-btn img {
        width: 18px;
        height: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="content">
    <div class="name">kandi :33</div>

    <div class="links">

      <div class="link-btn" onclick="window.open('https://x.com/freakycodone', '_blank')">
        <img src="twitter.png" alt="Twitter" />
      </div>

      <div class="link-btn" onclick="window.open('https://www.roblox.com/users/167229506/profile', '_blank')">
        <img src="roblox.png" alt="Roblox" />
      </div>

      <div class="link-btn" onclick="window.open('https://www.tiktok.com/@freakazoid02', '_blank')">
        <img src="tiktok.png" alt="TikTok" />
      </div>

      <div class="link-btn" onclick="window.open('https://www.youtube.com/@spicebush.mp4', '_blank')">
        <img src="youtube.png" alt="YouTube" />
      </div>

      <div class="link-btn" onclick="window.open('https://discord.com/users/spicebush07', '_blank')">
        <img src="discord.png" alt="Discord" />
      </div>

    </div>
  </div>

  <audio id="audio" loop preload="auto">
    <source src="Hollywood_Baby_100_gecs.mp3" type="audio/mpeg" />
  </audio>

  <script>
    const audio = document.getElementById('audio');

    const targetVolume = 0.7;
    const fadeDuration = 1200;

    let fadeInterval = null;
    let fadeToken = 0;
    let hasStarted = false;

    audio.volume = 0;

    function fadeAudio(target) {
      clearInterval(fadeInterval);

      const token = ++fadeToken;
      const steps = 40;
      const intervalTime = fadeDuration / steps;

      const startVolume = audio.volume;
      const difference = target - startVolume;
      let step = 0;

      fadeInterval = setInterval(() => {
        if (token !== fadeToken) return;

        step++;

        audio.volume = Math.max(
          0,
          Math.min(1, startVolume + difference * (step / steps))
        );

        if (step >= steps) {
          clearInterval(fadeInterval);
          fadeInterval = null;
          audio.volume = target;

          if (target === 0) {
            audio.pause();
          }
        }
      }, intervalTime);
    }

    function checkFocus() {
      const isActive = !document.hidden && document.hasFocus();

      if (isActive) {
        audio.play().then(() => {
          hasStarted = true;

          if (!document.hidden && document.hasFocus()) {
            fadeAudio(targetVolume);
          }
        }).catch(error => {
          console.log("Browser blocked autoplay:", error);
        });
      } else {
        if (hasStarted) {
          fadeAudio(0);
        }
      }
    }

    checkFocus();

    document.addEventListener('visibilitychange', checkFocus);
    window.addEventListener('focus', checkFocus);
    window.addEventListener('blur', checkFocus);
    window.addEventListener('load', checkFocus);
  </script>

</body>
</html>
